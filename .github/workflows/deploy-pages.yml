name: Deploy LIFEOS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Production build and release gate
        run: npm run verify

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload verified production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

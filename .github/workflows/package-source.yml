name: Package LIFEOS Source ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency: {group: lifeos-source-package, cancel-in-progress: true}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create source ZIP
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          zip -r "release/LIFEOS-MASTER-v${VERSION}-source.zip" . -x ".git/*" ".github/workflows/*" "release/*"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LIFEOS-MASTER-v${{ env.VERSION }}-source
          path: release/LIFEOS-MASTER-v${{ env.VERSION }}-source.zip
          if-no-files-found: error

name: LIFEOS QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f VERSION.txt
          grep -q "<title>LIFEOS</title>" index.html
          grep -q '"name":"LIFEOS"' manifest.webmanifest
      - name: Validate JavaScript syntax
        run: |
          node --check sw.js
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const m=h.match(/<script>([\s\S]*?)<\/script>/); if(!m) throw new Error('No application script found'); fs.writeFileSync('/tmp/lifeos.js',m[1]);"
          node --check /tmp/lifeos.js
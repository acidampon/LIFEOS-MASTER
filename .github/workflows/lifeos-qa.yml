name: LIFEOS QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run production release gate
        run: npm run verify

      - name: Validate production metadata
        run: |
          test -f www/index.html
          test -f www/manifest.webmanifest
          test -f www/sw.js
          test -f www/icon.svg
          test -f www/version.json
          grep -q '"version": "1.5.2"' www/version.json

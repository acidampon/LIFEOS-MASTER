name: LIFEOS QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lifeos-qa
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: timeout 60s npm run typecheck

      - name: Build production bundle
        run: DEBUG=vite:* timeout 35s npm run build

      - name: Verify release outputs
        run: timeout 60s node scripts/verify-release.mjs

      - name: Validate production metadata
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icon.svg
          test -f dist/version.json
          grep -q '"version":"2.0.0"' dist/version.json

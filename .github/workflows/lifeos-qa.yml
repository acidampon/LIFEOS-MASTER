name: LIFEOS QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f VERSION.txt
          grep -q "<title>LIFEOS</title>" index.html
          grep -q '"name":"LIFEOS"' manifest.webmanifest
      - name: Validate JavaScript syntax
        run: |
          node --check sw.js
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("index.html", "utf8");
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error("No application scripts found");
          scripts.forEach((m, i) => fs.writeFileSync(`/tmp/lifeos-script-${i}.js`, m[1]));
          console.log(`Validated ${scripts.length} inline script block(s)`);
          NODE
          for f in /tmp/lifeos-script-*.js; do node --check "$f"; done

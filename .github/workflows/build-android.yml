name: Build LIFEOS Android APK
on:
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: read, actions: write}
concurrency: {group: lifeos-android, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: npm install
      - run: timeout 180s npm run verify
      - run: npx cap add android
      - run: npx cap sync android
      - working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Package APK
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/LIFEOS-Android-v${VERSION}-debug.apk"
          sha256sum "release/LIFEOS-Android-v${VERSION}-debug.apk" | tee release/SHA256SUMS.txt
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: LIFEOS-Android-v${{ env.VERSION }}-debug
          path: |
            release/LIFEOS-Android-v${{ env.VERSION }}-debug.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

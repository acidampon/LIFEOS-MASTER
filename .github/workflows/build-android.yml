name: Build LIFEOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon.svg www/

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync LIFEOS into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Copy APK to release folder
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/LIFEOS-v1.3.1-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFEOS-Android-v1.3.1
          path: release/LIFEOS-v1.3.1-debug.apk
          retention-days: 30

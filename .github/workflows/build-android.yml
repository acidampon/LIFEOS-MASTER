name: Build LIFEOS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "package.json"
      - "scripts/**"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Production build and release gate
        run: npm run verify

      - name: Create Android project
        run: npx cap add android

      - name: Sync LIFEOS into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage installable APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p release
          cp "$APK" "release/LIFEOS-Android-v1.5.2-debug.apk"
          sha256sum "release/LIFEOS-Android-v1.5.2-debug.apk" | tee "release/SHA256SUMS.txt"
          ls -lh release/

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFEOS-Android-v1.5.2-debug
          path: |
            release/LIFEOS-Android-v1.5.2-debug.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
